<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codigos USSD - Cuba</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/alpinejs" defer></script>
  </head>

  <body x-data="ussdApp">
    <nav class="navbar navbar-dark bg-primary sticky-top">
      <div class="container">
        <span class="navbar-brand mb-0 h1"> Codigos USSD Cuba </span>
        <button
          class="btn btn-outline-light"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#cartOffcanvas"
        >
          Carrito (<span x-text="cart.length"></span>)
        </button>
      </div>
    </nav>

    <main class="container mt-4">
      <div class="mb-4">
        <input
          type="text"
          class="form-control form-control-lg"
          placeholder="Buscar codigo, descripcion o numero..."
          x-model="searchQuery"
        />
      </div>

      <div x-show="loading" class="text-center my-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <div class="container row">
        <template
          x-for="group in filteredData"
          :key="group.group + group.subgroup + (group.bank || '')"
        >
          <div class="card mb-3 col-12 col-lg-6">
            <div class="card-header bg-light">
              <h5 class="mb-0">
                <span x-text="group.group"></span>
                <template x-if="group.bank">
                  <span class="text-muted">
                    - <span x-text="group.bank"></span>
                  </span>
                </template>
                <span class="text-muted">
                  / <span x-text="group.subgroup"></span>
                </span>
              </h5>
            </div>
            <ul class="list-group list-group-flush">
              <template
                x-for="code in group.codes"
                :key="code.code + code.name"
              >
                <li class="list-group-item">
                  <div class="d-flex justify-content-between align-items-start">
                    <div class="me-3">
                      <strong x-text="code.name"></strong>
                      <p
                        class="mb-1 text-muted small"
                        x-text="code.description"
                      ></p>
                      <code class="text-primary" x-text="code.code"></code>
                    </div>
                    <button
                      class="btn btn-sm flex-shrink-0"
                      :class="isInCart(code) ? 'btn-success' : (code.vcf === false ? 'btn-secondary' : 'btn-primary')"
                      :disabled="code.vcf === false || isInCart(code)"
                      @click="addToCart(code)"
                      x-text="code.vcf === false ? 'Solo info' : (isInCart(code) ? 'Agregado' : 'Agregar')"
                    ></button>
                  </div>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </div>
      <div
        x-show="!loading && filteredData.length === 0"
        class="text-center text-muted my-5"
      >
        <h4>No se encontraron resultados</h4>
      </div>
    </main>

    <div
      class="offcanvas offcanvas-end"
      tabindex="-1"
      id="cartOffcanvas"
      aria-labelledby="cartOffcanvasLabel"
    >
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="cartOffcanvasLabel">
          Carrito de Contactos
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        <div class="mb-3">
          <label for="prefixInput" class="form-label">
            Prefijo del nombre del contacto
          </label>
          <input
            type="text"
            class="form-control"
            id="prefixInput"
            x-model="prefix"
          />
          <div class="form-text">
            Se añadira antes del nombre de cada codigo en el archivo VCF.
          </div>
        </div>

        <ul class="list-group mb-3">
          <template x-for="(item, index) in cart" :key="item.code + item.name">
            <li
              class="list-group-item d-flex justify-content-between align-items-center"
            >
              <div>
                <strong x-text="item.name"></strong>
                <br /><code x-text="item.code"></code>
              </div>
              <button
                class="btn btn-sm btn-outline-danger"
                @click="removeFromCart(index)"
              >
                Quitar
              </button>
            </li>
          </template>
          <li
            x-show="cart.length === 0"
            class="list-group-item text-center text-muted"
          >
            El carrito esta vacio
          </li>
        </ul>

        <button
          class="btn btn-primary w-100"
          :disabled="cart.length === 0"
          @click="downloadVcf()"
        >
          Descargar archivo VCF
        </button>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="app.js"></script>
  </body>
</html>
